<div class="sidebar" *ngIf="currentUser$ | async as user">
  <nav class="sidebar-nav">
    <a routerLink="/dashboard" routerLinkActive="active" class="nav-item">
      <div class="nav-icon-wrap"><mat-icon>dashboard</mat-icon></div>
      <span>Dashboard</span>
    </a>

    <a routerLink="/expenses" routerLinkActive="active" class="nav-item">
      <div class="nav-icon-wrap"><mat-icon>receipt_long</mat-icon></div>
      <span>Expenses</span>
    </a>

    <a routerLink="/expenses/add" routerLinkActive="active" class="nav-item">
      <div class="nav-icon-wrap add-icon"><mat-icon>add_circle</mat-icon></div>
      <span>Add Expense</span>
    </a>

    <a routerLink="/settlements" routerLinkActive="active" class="nav-item">
      <div class="nav-icon-wrap"><mat-icon>account_balance_wallet</mat-icon></div>
      <span>Settlements</span>
    </a>

    <a routerLink="/groups" routerLinkActive="active" class="nav-item">
      <div class="nav-icon-wrap"><mat-icon>group</mat-icon></div>
      <span>Groups</span>
    </a>

    <a routerLink="/profile" routerLinkActive="active" class="nav-item">
      <div class="nav-icon-wrap"><mat-icon>person</mat-icon></div>
      <span>Profile</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <div class="user-card">
      <div class="user-avatar">{{ getInitials(user.name) }}</div>
      <div class="user-details">
        <span class="user-name">{{ user.name }}</span>
        <span class="user-email">{{ user.email }}</span>
      </div>
    </div>
  </div>
</div>
