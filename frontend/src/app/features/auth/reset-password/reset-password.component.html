<div class="auth-page">
  <div class="auth-card">
    <div class="card-title">
      <div class="icon-badge soft"><mat-icon>lock_reset</mat-icon></div>
      <h2>Set New Password</h2>
      <p>Choose a strong password for your account.</p>
    </div>

    <div *ngIf="errorMessage" class="alert-danger">{{ errorMessage }}</div>
    <div *ngIf="successMessage" class="alert-success">{{ successMessage }}</div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="field">
        <label class="field-label" for="newPassword">New Password</label>
        <mat-form-field appearance="outline" class="full-width" subscriptSizing="dynamic">
          <mat-icon matPrefix>lock_outline</mat-icon>
          <input matInput id="newPassword" [type]="hidePassword ? 'password' : 'text'" formControlName="newPassword" placeholder="New password" />
          <button mat-icon-button type="button" matSuffix (click)="hidePassword = !hidePassword">
            <mat-icon>{{ hidePassword ? 'visibility' : 'visibility_off' }}</mat-icon>
          </button>
          <mat-error *ngIf="f['newPassword'].hasError('required')">Password is required</mat-error>
         <mat-error *ngIf="f['newPassword'].hasError('pattern')">Min 8 characters with uppercase, lowercase and a number</mat-error>
        </mat-form-field>
      </div>

      <div class="field">
        <label class="field-label" for="confirmPassword">Confirm Password</label>
        <mat-form-field appearance="outline" class="full-width" subscriptSizing="dynamic">
          <mat-icon matPrefix>lock_reset</mat-icon>
          <input matInput id="confirmPassword" [type]="hidePassword ? 'password' : 'text'" formControlName="confirmPassword" placeholder="Re-enter password" />
          <mat-error *ngIf="form.hasError('passwordMismatch') && f['confirmPassword'].touched">Passwords do not match</mat-error>
        </mat-form-field>
      </div>

      <button mat-flat-button class="submit-button" type="submit" [disabled]="loading || !token">
        <mat-spinner *ngIf="loading" diameter="20"></mat-spinner>
        <ng-container *ngIf="!loading">Update Password <mat-icon>arrow_forward</mat-icon></ng-container>
      </button>
    </form>

    <a routerLink="/auth/login" class="back-link">← Back to Login</a>
  </div>
</div>
