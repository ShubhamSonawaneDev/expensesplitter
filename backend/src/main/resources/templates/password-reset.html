<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"></head>
<body style="font-family: Arial, sans-serif; background:#f8fafc; padding:24px;">
  <div style="max-width:480px; margin:0 auto; background:#fff; border-radius:16px; padding:32px;">
    <h2 style="color:#0f172a; margin-top:0;">Reset your password</h2>
    <p style="color:#475569;">Hi <span th:text="${userName}">there</span>,</p>
    <p style="color:#475569;">Click the button below to set a new password. This link expires in 15 minutes.</p>
    <p style="text-align:center; margin:28px 0;">
      <a th:href="${resetUrl}"
         style="background:#0f172a; color:#fff; padding:12px 24px; border-radius:10px; text-decoration:none; font-weight:bold;">
        Reset Password
      </a>
    </p>
    <p style="color:#94a3b8; font-size:12px;">If you did not request this, you can ignore this email.</p>
  </div>
</body>
</html>
